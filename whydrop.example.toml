# whydrop agent configuration. Every key is optional; this file documents the full schema.
# Precedence: WHYDROP_* environment variables > this file > built-in defaults.
# Secrets never go here: WHYDROP_SECRET and WHYDROP_UI_TOKEN come from the environment only.

agent_name = "home"                      # shown in the dashboard header and alerts (≤ 64 characters)
# reflector = "reflector.example.net"    # host or host:port, IPv4 or a name; enables precision mode (needs WHYDROP_SECRET)
db_path = "./whydrop-data/whydrop.db"

# Auto-detection overrides (leave unset unless detection gets it wrong)
# gateway = "192.0.2.1"
# gateway_port = 1                       # a closed TCP port on the router (RST = alive)
# router_dns = "192.0.2.1"
# isp_dns = ["198.51.100.53"]
# wifi_interface = "wlan0"

# Probe intervals in seconds (0.5–3600)
# [intervals]
# host_net = 1.0
# wifi = 1.0                             # Linux (iw)
# wifi_windows = 2.0                     # Windows (netsh is slower)
# gateway = 1.0
# line_hb = 1.0
# dns = 5.0
# dns_tcp = 5.0
# stun = 10.0
# tcp_connect = 2.0

# Replace the public targets (e.g. to drop a provider). Each needs addr, port, kind (dns | stun | tcp443), provider;
# proto (udp | tcp) defaults to udp.
# [[targets]]
# addr = "9.9.9.9"
# port = 53
# kind = "dns"
# proto = "udp"
# provider = "quad9"

[web]
bind = "127.0.0.1:8790"                  # the compose quick start uses 0.0.0.0:8790
allowed_hosts = []                       # extra Host names allowed besides localhost and the bind address
public_view_default = false

[canary]
idle_interval_s = 600                    # 30–7500; how long the idle TCP connection stays silent

[udp_stream]
pps = 10                                 # 1–100 packets a second

[nat]
enable_7500 = false                      # also try 7500 s TCP (just over the RFC 5382 minimum of 2 h 4 min) in nat-test and the dashboard button

[notify]
# webhook_url = "https://ntfy.sh/your-topic"
# format = "ntfy"                        # json | ntfy | discord
# lang = "en"                            # en | ko: the alert text, in the dashboard's words
# kuma_push_url = ""

[storage]
# min_free_mb = 2048                     # stop writing below this much free space
