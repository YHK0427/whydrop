name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: uv export --locked --extra web --no-dev --no-emit-project --format requirements-txt -o /tmp/req.txt && diff -q <(grep -v '^#' /tmp/req.txt) <(grep -v '^#' requirements-web.txt)
      - run: uv run pytest -q
      - run: uv run python scripts/check_doc_pairs.py
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q -m ui tests/ui
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q
  dissector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q tests/integration/test_dissector.py -rs
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t whydrop:ci .
      - run: docker run --rm whydrop:ci --version
      - run: docker run --rm --read-only --tmpfs /tmp --user 10001 whydrop:ci reflector --help
      - run: docker compose config -q
      - name: the reflector runs from the image as docs/deploy-reflector says
        run: |
          docker run -d --name refl -p 48100:48100/udp -p 48100:48100/tcp             -e WHYDROP_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"             -v refl:/data --read-only --cap-drop ALL --security-opt no-new-privileges whydrop:ci reflector --state-dir /data
          sleep 3
          docker logs refl 2>&1 | tee /dev/stderr | grep -q "listening udp"
          test "$(docker inspect -f '{{.State.Running}}' refl)" = true
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
