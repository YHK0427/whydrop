[project]
name = "whydrop"
version = "0.1.0.dev0"
description = "Self-hosted network black box: records when, where and why your home internet dropped."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.scripts]
whydrop = "whydrop.cli:main"

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.65.2",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whydrop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
