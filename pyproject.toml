[project]
name = "whydrop"
version = "0.6.1"
description = "Self-hosted network black box: records when, where and why your home internet dropped."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = []
keywords = ["network", "monitoring", "packet-loss", "nat", "wifi", "isp", "self-hosted", "homelab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/YHK0427/whydrop"
Demo = "https://yhk0427.github.io/whydrop/"
Changelog = "https://github.com/YHK0427/whydrop/blob/main/CHANGELOG.md"
Issues = "https://github.com/YHK0427/whydrop/issues"

[project.scripts]
whydrop = "whydrop.cli:main"

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.65.2",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whydrop"]

[tool.hatch.build.targets.sdist]
exclude = ["demo", "docs/media"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests", "tests/ui"]
markers = ["ui: browser checks of the dashboard (Playwright + Chromium); run with -m ui"]
addopts = "-m 'not ui'"
