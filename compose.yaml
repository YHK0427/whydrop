# whydrop agent: records your connection 24/7. Start with `docker compose up -d`.
# Host networking is required: the agent must see the real interfaces, gateway and Wi-Fi, not Docker's.
services:
  whydrop:
    build: .
    image: whydrop:local
    command: ["agent"]
    network_mode: host
    user: "10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpu_shares: 256              # lower priority only; a hard CPU quota would distort the measurements
    environment:
      WHYDROP_DB_PATH: /data/whydrop.db
      WHYDROP_REFLECTOR: ${WHYDROP_REFLECTOR:-}            # host[:port] of your reflector → precision mode
      WHYDROP_SECRET: ${WHYDROP_SECRET:-}                  # from .env only; never written here
      WHYDROP_WEB_BIND: ${WHYDROP_WEB_BIND:-0.0.0.0:8790}   # LAN-reachable; a token is generated and logged once
      WHYDROP_UI_TOKEN: ${WHYDROP_UI_TOKEN:-}
      WHYDROP_WEB_ALLOWED_HOSTS: ${WHYDROP_WEB_ALLOWED_HOSTS:-}   # extra host names, comma-separated
      WHYDROP_AGENT_NAME: ${WHYDROP_AGENT_NAME:-home}       # shown in the dashboard header and alert titles
    volumes:
      - whydrop-data:/data
      - /run/systemd/resolve:/run/systemd/resolve:ro
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  whydrop-data:
